  <script>window.WDN_DATA = {"version":"v0.96","updated":"12 novembre 2026","source":"Documentation et historique des changements du mod jusqu'à la v0.96","roles":[{"id":"wolf","key":"WOLF","title":"Loup-garou","camp":"Meute","lines":["JOUR : aide ou sabote une mission une fois par jour.","NUIT : transforme-toi avec R. Attaque à nouveau après ton délai de recharge individuel (60 s par défaut).","INSTINCT : révèle les silhouettes. Dash légèrement renforcé, coût de 30 % d’endurance lorsque le réglage est activé.","Les autres loups sont tes alliés : communique avec eux grâce au chat de meute /lg <message>."],"icon":null,"goal":"Faire gagner la meute contre le village."},{"id":"illusionist","key":"ILLUSIONIST","title":"Loup Illusionniste","camp":"Meute","lines":["POUVOIRS DU LOUP : transformation, voix grave, vitesse, bond, vision nocturne, attaque et instinct de chasse.","JOUR : participe aux missions ou sabote-les ; canal secret /lg <message>.","NUIT : avec R, crée une seule fausse scène de chasse avec une dépouille factice.","Le Détective suit les fausses griffures et les cendres au lieu des vraies traces.","Son enquête ne peut jamais accuser un innocent : la fausse piste brouille seulement le résultat.","Le faux corps est visible, mais ne correspond à aucun mort et ne change pas le nombre de survivants.","Seul le Détective peut voir les traces trompeuses liées à cette scène."],"icon":null,"goal":"Faire gagner la meute contre le village."},{"id":"camouflage_wolf","key":"CAMOUFLAGE_WOLF","title":"Loup Caméléon","camp":"Meute","lines":["Comme tout loup, tu conserves la transformation, la voix, l’instinct, le bond et la chasse.","NUIT : utilise R pour copier le skin ET le nom d’un joueur proche pendant 30 s (une fois par nuit).","Tu portes aussi ce skin, visible en F5. Le nom revient à la normale après 30 s.","Copie impossible sous forme de loup : la voix et les pouvoirs restent les tiens."],"icon":null,"goal":"Faire gagner la meute contre le village."},{"id":"howler_wolf","key":"HOWLER_WOLF","title":"Loup Hurleur","camp":"Meute","lines":["Comme tout loup, tu conserves la transformation, la voix, l’instinct, le bond et la chasse.","JOUR OU NUIT : hurle avec R, sous forme humaine OU de loup (une fois par cycle).","PORTÉE : 12 blocs. Le hurlement bloque le micro et l’écoute Simple Voice Chat des joueurs proches pendant 10 s.","Aucun joueur à portée ? Le pouvoir n’est pas consommé. Attention : le hurlement révèle ta position."],"icon":null,"goal":"Faire gagner la meute contre le village."},{"id":"shadow_wolf","key":"SHADOW_WOLF","title":"Loup des Ombres","camp":"Meute","lines":["LOUP : tu conserves les pouvoirs de meute, la transformation et l’instinct.","NUIT : R te rend presque invisible pendant une durée choisie par l’hôte (une fois par nuit).","Pendant cette invisibilité, tu ne peux attaquer personne ; les bruits peuvent te trahir."],"icon":null,"goal":"Faire gagner la meute contre le village."},{"id":"infected_wolf","key":"INFECTED_WOLF","title":"Loup Infecté","camp":"Meute","lines":["MEUTE : tu disposes des pouvoirs ordinaires du loup.","NUIT : ouvre R pour préparer ou annuler ton infection avant d’attaquer.","Une seule fois par partie, le coup qui aurait dû tuer une cible non-loup la transforme en Loup-garou.","La cible reste vivante, conserve son identité publique et rejoint secrètement la meute.","Un bouclier bloque normalement l’attaque ; il n’y a pas de seconde élimination gratuite.","La nouvelle recrue doit attendre son délai de recharge initial avant d’attaquer."],"icon":null,"goal":"Faire gagner la meute contre le village."},{"id":"white_wolf","key":"WHITE_WOLF","title":"Loup Blanc","camp":"Solitaire","lines":["SOLITAIRE : tu partages en apparence la meute et les pouvoirs ordinaires des loups.","NUIT : tu peux chasser les humains normalement, avec ton délai de recharge personnel (60 s par défaut).","NUIT : une fois PAR NUIT, active tes griffes sur une seule main avec R pour tuer un autre loup.","À moins de 3 blocs, vise le dos d’un loup et maintiens le clic droit (durée réglable par l’hôte).","VICTOIRE : être le DERNIER joueur vivant, loups ET villageois compris."],"icon":"white_wolf_claw.png","goal":"Être le DERNIER joueur vivant, loups ET villageois compris."},{"id":"apothecary","key":"APOTHECARY","title":"Apothicaire","camp":"Village","lines":["VILLAGE : une bouteille vide Minecraft est ton objet de pouvoir.","REMÈDE : soigne les trois poisons de l’Alchimiste fou, une fois par nuit (4 blocs).","DIAGNOSTIC : examine une personne par nuit ; résultat SAIN, TRACES ou CONTAMINÉ (sans révéler le Rat).","ANTIDOTE RAT : retire une infection en cours ou complète, une seule fois par partie.","Clique sur un patient avec la bouteille pour le remède ; accroupi + clic pour l’antidote. Choix via R.","Aucun remède n’annule les victimes déjà comptabilisées par l’Alchimiste fou.","Un diagnostic ne révèle jamais qui est le Rat malade."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"traitor","key":"TRAITOR","title":"Traître","camp":"Meute","lines":["SECRET : tu parais villageois aux yeux de la Voyante.","Tu reconnais les loups grâce à un symbole rouge (✦) au-dessus de leur tête, visible par toi seul.","Les loups ne savent PAS que tu es le Traître. Tu n’as pas accès à leur chat vocal.","Tu n’as PAS les pouvoirs des loups, mais tu gagnes avec la meute.","Ta véritable allégeance reste secrète ; le village peut te prendre pour un allié."],"icon":null,"goal":"Faire gagner la meute contre le village."},{"id":"mad_alchemist","key":"MAD_ALCHEMIST","title":"Alchimiste fou","camp":"Solitaire","lines":["SOLITAIRE : ta fiole violette est directement prête dans ta barre rapide.","1. Ouvre R pour choisir un poison : Folie, Paralysie ou Confusion.","2. La NUIT, vise un joueur à 3 blocs et maintiens le clic droit pendant 1,5 seconde.","LIMITE : une seule victime par nuit, toujours une personne DIFFÉRENTE.","EFFETS : Folie 25 s ; Paralysie 12 s ; Confusion 20 s.","VICTOIRE : utilise les TROIS poisons et atteins le quota de victimes :","3 (6–7 joueurs), 4 (8–15), 6 (16–30), 8 (31–50). La partie continue."],"icon":null,"goal":"Empoisonner des joueurs différents avec les trois poisons et atteindre le quota (victoire personnelle)."},{"id":"pacifist","key":"PACIFIST","title":"Pacifiste","camp":"Solitaire","lines":["SOLITAIRE : vote PASSER lors des réunions.","Tu remportes une victoire personnelle après avoir contribué à trois réunions sans exécution.","Ton menu R affiche en privé ton compteur X/3 et le nombre de votes restants.","Un rappel privé apparaît au lancement et à la fin de chaque scrutin.","Tu dois être vivant et avoir effectivement voté PASSER ; la manche continue."],"icon":null,"goal":"Obtenir 3 votes PASSER sans exécution validés."},{"id":"little_girl","key":"LITTLE_GIRL","title":"Petite Fille","camp":"Village","lines":["VILLAGE : lis le chat écrit de la meute en permanence, de jour comme de nuit.","CHAT : chaque message affiche « Loup inconnu », jamais le nom de l’expéditeur.","NUIT : tu disposes automatiquement de la vision nocturne jusqu’au matin.","POUVOIR R : écoute temporairement les micros des loups proches pendant la durée fixée par l’hôte.","Pendant l’écoute, ton micro est coupé ; tu ne peux pas parler dans le canal des loups.","Si tu t’approches trop, un loup peut repérer tes mouvements."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"wild_child","key":"WILD_CHILD","title":"Enfant Sauvage","camp":"Liens","lines":["RÔLE SECRET : choisis un modèle vivant dans R au début de la partie.","Si ce modèle meurt, tu rejoins définitivement les loups et obtiens leurs pouvoirs.","Avant ce changement, tu appartiens au Village."],"icon":null,"goal":"Gagner avec ton camp final après le changement éventuel."},{"id":"usurper","key":"USURPER","title":"Usurpateur","camp":"Liens","lines":["RÔLE SECRET : récupère une seule fois le rôle d’un joueur mort.","R te permet de choisir librement parmi les morts (hors titre de Maire).","Tu rejoins son camp et reçois les capacités normales du rôle obtenu."],"icon":null,"goal":"Gagner avec ton camp final après le changement éventuel."},{"id":"twins","key":"TWINS","title":"Jumeaux","camp":"Liens","lines":["RÔLE SECRET : vous êtes deux et connaissez votre partenaire.","Un petit symbole turquoise au-dessus de sa tête n’est visible que par toi.","CHAT PRIVÉ : /werewolf jumeau <message> (sans limite de distance).","Dans R, active ou désactive la voix privée. Elle reste limitée par la proximité SVC (20 blocs ou chuchotement).","Un indicateur turquoise reste visible sur ton HUD tant que ton micro est privé (déplaçable avec H).","Si l’un meurt, l’autre survit : aucun lien mortel."],"icon":null,"goal":"Aider le Village à gagner sans perdre ton allié."},{"id":"soul_collector","key":"SOUL_COLLECTOR","title":"Collectionneur d’âmes","camp":"Solitaire","lines":["SOLITAIRE : trouve les âmes sur les lieux des morts ; maintiens la lanterne (clic droit pendant 1,5 s) pour les capturer.","Chaque âme est unique. Termine ton quota pour obtenir une victoire personnelle définitive.","La partie continue et ta victoire reste acquise, même après ta mort."],"icon":null,"goal":"Capturer le quota d’âmes : victoire personnelle."},{"id":"priest","key":"PRIEST","title":"Prêtre","camp":"Village","lines":["NUIT : utilise la relique avec R ou le clic droit pour repousser les loups transformés à 7 blocs.","RECHARGE : une nuit sur deux. Aucun loup à portée ? La charge n’est PAS dépensée.","La relique ne tue personne et ne révèle pas l’identité des loups."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"seer","key":"SEER","title":"Voyante","camp":"Village","lines":["NUIT : vise un joueur vivant à 20 blocs maximum, puis ouvre R pour inspecter son rôle.","PORTÉE : 20 blocs exactement, vérifiés par le serveur.","LIMITE : nombre de visions par nuit et délai de recharge définis par l’hôte ; le résultat reste privé.","VICTOIRE : aide le Village à éliminer les loups ou à remplir les missions."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"witch","key":"WITCH","title":"Sorcière","camp":"Village","lines":["NUIT : la victime des loups t’est annoncée en privé.","POISON : cible un joueur vivant à 15 blocs maximum (avec R). Le soin vise la victime annoncée.","Avec R, gère les potions de soin et de poison ; les quantités sont définies par l’hôte.","Une cible sous forme de loup apparaît comme « Inconnu » : son identité n’est pas dévoilée.","Si tu meurs alors qu’il te reste un soin, tu disposes de 30 secondes pour te ranimer."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"trapper","key":"TRAPPER","title":"Trappeur","camp":"Village","lines":["JOUR : pose un piège invisible avec R ; le nombre autorisé dépend des règles.","NUIT : le loup transformé qui traverse ton piège reste immobilisé pendant 5 secondes, sans dégâts."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"protector","key":"PROTECTOR","title":"Protecteur","camp":"Village","lines":["JOUR : choisis avec R un joueur à protéger, selon la limite du salon.","Le premier coup d’un loup contre lui sera annulé la nuit suivante."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"detective","key":"DETECTIVE","title":"Détective","camp":"Village","lines":["JOUR : suis la flèche au-dessus de la barre d’XP pour trouver les traces.","À moins de 8 blocs, prends la loupe (case 6) et maintiens le clic droit pendant 5 secondes.","Relâcher avant la fin annule l’analyse sans consommer de tentative. Le quota dépend de l’hôte.","5 % de chance de révéler le NOM DU LOUP responsable, puis +0,5 point par jour."],"icon":"detective_magnifier.png","goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"miner","key":"MINER","title":"Mineur","camp":"Village","lines":["NUIT : tu disposes automatiquement de la vision nocturne.","PASSAGES : tu peux ouvrir les trappes Airy Spruce des loups-garous.","SECRET : toi seul peux ouvrir les portes Paper Dark Oak Door.","Tu appartiens au camp du Village : garde ton identité secrète."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"hunter","key":"HUNTER","title":"Chasseur","camp":"Village","lines":["MORT : pendant 20 secondes, tu peux choisir avec R un dernier joueur à éliminer.","Les fantômes se voient entre eux en transparence au camp."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"cupid","key":"CUPID","title":"Cupidon","camp":"Liens","lines":["PREMIER JOUR : choisis deux amoureux avec R (deux sélections).","Tu peux te choisir comme premier ou second amoureux.","Si l’un des deux meurt, l’autre meurt aussi.","Seuls les amoureux et toi voyez un petit cœur près de leurs pseudos.","Si ton couple remporte la partie, tu gagnes avec lui."],"icon":null,"goal":"Former un couple ; si le couple gagne, tu gagnes aussi."},{"id":"sick_rat","key":"SICK_RAT","title":"Rat malade","camp":"Solitaire","lines":["JOUR ET NUIT : reste à moins de 5 blocs de tes cibles.","Tu vois le pourcentage au-dessus de la tête des autres joueurs (toi seul).","CONTAMINATION : +1 %/s, sur 2 joueurs à la fois par défaut (réglable par l’hôte).","Propagation secondaire facultative : les victimes à 100 % contaminent très lentement à 3 blocs.","Aucune contamination en réunion ou pendant le vote.","L’Apothicaire peut diagnostiquer les traces et soigner avec un seul antidote.","OBJECTIF SOLO : infecter tous les autres survivants avant de mourir."],"icon":null,"goal":"Infecter tous les autres survivants avant de mourir."},{"id":"bounty_hunter","key":"BOUNTY_HUNTER","title":"Chasseur de primes","camp":"Solitaire","lines":["CAMP : indépendant, sans transformation ni pouvoirs de loup.","CONTRATS : ouvre ton livre pour connaître le prénom de ta cible et tes primes.","LAME : place-toi derrière ta cible (3 blocs max), puis maintiens MAJ/SHIFT pour t’accroupir ET le clic droit pendant 1,5 seconde.","Un léger cliquetis de lame avertit les joueurs proches au début de la tentative.","Une brève rotation de la cible (0,4 s) ne remet plus le compteur à zéro.","PIÈGE : clic droit pour le poser ; ralentissement et nausée pendant 2 secondes.","PIÈGE : un seul actif et une seule pose par jour. Pose interdite pendant les votes.","VICTOIRE : nombre de contrats requis selon les joueurs (1 si moins de 6, 2 si moins de 12, sinon 3).","Après l’objectif atteint, ta victoire est acquise même si tu meurs ; la partie continue.","Le contrat suivant est attribué au prochain jour, sans annonce publique."],"icon":"bounty_blade.png","goal":"Accomplir les contrats requis selon le nombre de joueurs (1 si moins de 6, 2 si moins de 12, sinon 3)."},{"id":"mayor","key":"MAYOR","title":"Maire","camp":"Titre","lines":["TITRE PUBLIC : élection au premier vote si l’hôte a activé la mairie.","VOTE : le bulletin de la personne couronnée compte double.","Si le Maire accuse la cible du Corbeau, le bonus de +1 du Corbeau ne s’ajoute pas.","Ce titre se cumule avec ton rôle secret : ce n’est pas un rôle distribué."],"icon":null,"goal":"Titre public : l’objectif de ton rôle secret ne change pas."},{"id":"villager","key":"VILLAGER","title":"Villageois","camp":"Village","lines":["JOUR : réussis les missions communes pour faire progresser le Village.","VOTE : démasque les loups. NUIT : cache-toi ou prends la fuite.","VICTOIRE : tous les loups sont éliminés ou la jauge du Village atteint 100 %."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"sprinter","key":"SPRINTER","title":"Sprinteur","camp":"Village","lines":["VILLAGE : tu disposes de 25 % de sprint supplémentaire (18,75 secondes au total).","OBJET : bottes en cuir « Coup d’accélération » dans la barre rapide. Clic droit : Vitesse II pendant 5 secondes.","Cet objet de pouvoir reste dans sa case : impossible de le déplacer, de le jeter ou de l’équiper comme armure.","COÛT : 30 % d’endurance ; tu dois avoir au moins 30 % et ne pas être épuisé.","UTILISATION : UNE seule fois par nuit, avec recharge à la nuit suivante.","CONTREPARTIE : si ton endurance est vide, tu subis 4 secondes d’épuisement au lieu de 2.","L’endurance continue à diminuer pendant le sprint sous Vitesse II.","Si l’hôte désactive l’endurance, le pouvoir reste utilisable une fois par nuit sans coût."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"sentinel","key":"SENTINEL","title":"Sentinelle","camp":"Village","lines":["JOUR : place un poste avec R (une fois par jour).","Toi seul vois le cercle de 8 blocs, de jour comme de nuit.","NUIT : tout loup dans le cercle est repéré, même NON TRANSFORMÉ.","RÉUNION : titre visible et rapport PRIVÉ indiquant le nombre de loups distincts détectés (sans noms).","CARTE : balise bleue privée sur la carte intégrée ou sur Xaero World Map (M)."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"crow","key":"CROW","title":"Corbeau","camp":"Village","lines":["NUIT : tu possèdes la vision nocturne, comme le Chat noir.","ATTENDS 60 secondes après le lancement de la manche pour repérer des joueurs.","Reste pendant 3 secondes à 6 blocs d’un joueur vivant pour débloquer définitivement son nom.","NUIT : choisis avec R un nom débloqué, une nuit sur deux.","RÉUNION : accusation anonyme et +1 voix contre la cible lors du vote d’élimination,","y compris au second tour, mais JAMAIS lors de l’élection du Maire.","ANTI-CUMUL : si le Maire vote contre ta cible, les voix ne s’ajoutent pas (2, pas 3).","Un symbole Corbeau apparaît sur ton suspect pendant le vote, visible par le Village."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"black_cat","key":"BLACK_CAT","title":"Chat noir","camp":"Village","lines":["JOUR OU NUIT : observe un joueur à 8 blocs maximum avec R.","Une seule observation pour toute la manche (jour + nuit).","VOTE : aucun pouvoir ; recharge à la prochaine journée.","RÉSULTAT : OUI ou NON, la cible possède-t-elle la vision nocturne liée à son rôle ?","NUIT : tu possèdes aussi la vision nocturne. Aucune identité de loup n’est révélée."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"locksmith","key":"LOCKSMITH","title":"Serrurier","camp":"Village","lines":["NUIT : ta clé, initialement en case 6 (case 7 vide, grimoire en 8, carnet en 9), permet de fermer une porte pendant 60 secondes.","Fais un clic droit avec la clé sur une porte à moins de 5 blocs.","Une seule porte par nuit. Avec la même clé, tu peux la rouvrir plus tôt.","Le compte à rebours s’affiche AU CENTRE de la porte pour tout le monde.","Les autres joueurs ne peuvent ni ouvrir ni casser la porte verrouillée."],"icon":"locksmith_key.png","goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"medium","key":"MEDIUM","title":"Médium","camp":"Village","lines":["JOUR OU NUIT : ouvre R pour activer les murmures des défunts.","NUIT : vision nocturne automatique pendant toute la nuit, sans consommer ton écoute.","Pendant une durée choisie par l’hôte, tu entends les morts et peux leur répondre via Simple Voice Chat.","Leurs voix sont graves, spectrales et légèrement réverbérées pour toi uniquement.","Tu continues aussi à entendre les vivants normalement.","Une seule activation par manche, au choix le jour OU la nuit.","VOTE : pouvoir coupé sans report des secondes restantes. Recharge au nouveau jour.","Une barre violette discrète affiche le temps restant, visible uniquement par le Médium."],"icon":null,"goal":"Village : éliminer les loups ou remplir les objectifs communs."},{"id":"conteur","key":"CONTEUR","title":"Conteur","camp":"Village","lines":["STATUT : rôle de la manche, pouvoir accessible via R selon la phase.","LIVRE function decorateImportantText(root){
 const selector='.prose p, .prose li, .lead, .hero-copy p, .card-desc, .role-link p, .footnote, .cmd-item p';
 const nodes=[];
 root.querySelectorAll(selector).forEach(el=>{
  const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{
   acceptNode(n){return n.textContent.trim() && !n.parentElement.closest('code,kbd,a,button,.semantic-mark,.inline-tag,.rule-emoji,.accent-key')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}
  });
  while(tw.nextNode())nodes.push(tw.currentNode);
 });
 nodes.forEach(node=>{
  const str=node.textContent;emphasisPattern.lastIndex=0;
  if(!emphasisPattern.test(str))return;
  emphasisPattern.lastIndex=0;
  const frag=document.createDocumentFragment();let prev=0,match;
  while((match=emphasisPattern.exec(str))){
   if(match.index>prev)frag.appendChild(document.createTextNode(str.slice(prev,match.index)));
   const accent=document.createElement('span');
   accent.className='semantic-mark '+(match[1]?'tone-danger':match[2]?'tone-safe':match[3]?'tone-info':'tone-gold');
   accent.textContent=match[0];frag.appendChild(accent);prev=match.index+match[0].length;
  }
  if(prev<str.length)frag.appendChild(document.createTextNode(str.slice(prev)));
  node.replaceWith(frag);
 });
}

function sidebarHtml(){
 let out='';
 menus.forEach(group=>{
  out+=`<div class="side-micro">${group.title}</div>`;
  group.items.forEach(id=>{
   out+=`<a class="sidebar-link ${current===id?'active':''}" href="#/${id}"><span class="side-label"><span class="side-symbol" aria-hidden="true">${menuEmoji[id]||'📖'}</span>${clean(docs[id].title)}</span>${id==='roles'?`<span class="side-count">${data.roles.length}</span>`:id==='destins'?`<span class="side-count">${data.destinies.length}</span>`:''}</a>`;
   if(id==='roles'){
    categoryOrder.forEach(cat=>{
      const entries=data.roles.filter(r=>r.camp===cat);
      out+=`<button type="button" class="side-toggle" data-cat="${cat}" aria-expanded="${!collapsed[cat]}"><span class="side-label"><span class="side-symbol" aria-hidden="true">${campEmoji[cat]}</span>${clean(cat)} <span class="side-count">${entries.length}</span></span><span class="chev">${collapsed[cat]?'▸':'▾'}</span></button>`;
      if(!collapsed[cat])out+=`<div class="sidebar-subnav">${entries.map(r=>`<a href="#/role/${r.id}" class="sidebar-link ${current==='role/'+r.id?'active':''}">${clean(r.title)}</a>`).join('')}</div>`;
    });
   }
  });
 });
 sc.innerHTML=out;
 sc.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>{collapsed[btn.dataset.cat]=!collapsed[btn.dataset.cat]; sidebarHtml()}));
 const active=sc.querySelector('.sidebar-link.active');
 if(active && current!=='accueil')active.scrollIntoView({block:'nearest'});
}
function pageLayout(title,lead,inner,section='Grimoire',extra=''){
 const crumb=`<nav class="crumbs" aria-label="Fil d'Ariane">${link('accueil','Grimoire')}<span class="sep">/</span><span>${clean(section)}</span><span class="sep">/</span><span>${clean(title)}</span></nav>`;
 return `<div class="content-inner"><div class="prose">${crumb}<div class="eyebrow">${clean(section)}</div><h1 class="page-title">${clean(title)}</h1>${extra}${lead?`<p class="lead">${clean(lead)}</p>`:''}${inner}<div class="footnote"><strong>Source :</strong> code et codex de Werewolf: Dark Nights ${clean(data.version)}. Le site décrit les règles présentes dans les sources ; leur fonctionnement en partie doit encore être validé en jeu. · ${link('versions','Historique et statut')}</div></div></div>`;
}
function cards(items){return `<div class="cards">${items.map(it=>`<a href="#/${it.id}" class="doc-card"><span class="card-icon">${it.icon||'✦'}</span><span class="card-title">${clean(it.title)}</span><span class="card-desc">${clean(it.desc)}</span><span class="card-arrow">↗</span></a>`).join('')}</div>`}
function home(){
 const hero=`<section class="hero"><div class="hero-copy"><div class="hero-eyebrow">LES CHRONIQUES DU VILLAGE</div><h1>La nuit révèle<br><em>les véritables visages.</em></h1><p>Bienvenue dans le grimoire de <strong>Werewolf: Dark Nights</strong>. Apprends à survivre, découvre les rôles et prépare les prochaines parties dans l’ombre du village.</p><div class="hero-actions"><a class="btn" href="#/presentation">Découvrir le jeu <span>↗</span></a><a class="btn secondary" href="#/roles">Explorer les rôles <span>→</span></a></div></div></section>`;
 return `<div class="content-inner"><div class="eyebrow">Documentation · Forge 1.20.1</div>${hero}<div class="site-stats">${statItems.map(x=>`<div><strong>${x.num}</strong><span>${clean(x.label)}</span></div>`).join('')}</div><div class="prose"><div class="legend-strip" aria-label="Code couleur de la documentation"><span>🐺 <b class="tone-danger">Danger / Loups</b></span><span>🛡️ <b class="tone-safe">Protection / Village</b></span><span>🔍 <b class="tone-info">Informations</b></span><span>⭐ <b class="tone-gold">Règles importantes</b></span></div>${heading('Explore le grimoire','explorer')}<p class="lead">Une documentation à la manière d’un wiki : chaque rubrique a sa propre page et toutes les entrées sont accessibles depuis le menu ou la recherche.</p></div>${cards([{id:'commencer',icon:'⚒️',title:'Bien commencer',desc:'Installation, préparation et premières étapes.'},{id:'roles',icon:'🎭',title:'Les rôles',desc:'Village, meute, indépendants et liens particuliers.'},{id:'missions',icon:'📜',title:'Les missions',desc:'101 modèles répartis dans le village, le château et le port.'},{id:'evenements',icon:'🌙',title:'Les événements',desc:'Lune de sang, éclipse, brume, corbeaux et phénomènes étranges.'},{id:'destins',icon:'✨',title:'Destins Secrets',desc:'Des objectifs secondaires rares qui apparaissent pendant la manche.'},{id:'host',icon:'🛡️',title:'Guide de l’hôte',desc:'Vérification de carte, commandes et reprise de partie.'}])}${notice('Documentation en cours de construction','Les 45 fiches de rôle sont synchronisées avec les textes du grimoire du mod v0.90. Ce n’est pas une validation du lancement Forge ou de l’équilibrage en situation réelle.',true)}<div class="footnote">Site de documentation original pour Werewolf: Dark Nights · Version documentaire 0.96 · Fiches détaillées actualisées en v0.96.</div></div>`;
}
function ruleList(lines){return `<ul class="rule-list">${lines.map(line=>{
 const idx=line.indexOf(' : ');
 const label=idx>0&&idx<30?`<b>${clean(line.slice(0,idx))} :</b> ${clean(line.slice(idx+3))}`:clean(line);
 return `<li><span class="rule-emoji" aria-hidden="true">${ruleEmoji(line)}</span>${label}</li>`
}).join('')}</ul>`}
function roleDetailLine(line){
 const idx=line.indexOf(' : ');
 const title=idx>0&&idx<36?line.slice(0,idx):'';
 const detail=title?line.slice(idx+3):line;
 const colored=clean(detail).replace(/(\d+(?:[.,]\d+)?\s*(?:blocs?|secondes?|minutes?|s\b|%))/gi,'<mark class="role-figure">$1</mark>');
 return `<li class="role-step"><span class="role-step-dot">✦</span><div>${title?`<strong>${clean(title)}</strong><span>${colored}</span>`:`<span>${colored}</span>`}</div></li>`;
}
function rolePage(r){
 const steps=r.lines.map(roleDetailLine).join('');
 const goal=`<section class="role-goal"><strong>★ COMMENT GAGNER</strong><p>${clean(r.goal||'Aider ton camp à gagner la manche.')}</p></section>`;
 const meta=`<div class="meta-row">${badge(r.camp,r.camp)}${badge('Fiche complète')}<span class="minor">${clean(data.version)} · ${clean(r.key)}</span></div>`;
 const inner=`${goal}${r.icon?`<img class="role-art" src="${(window.WDN_ASSETS && window.WDN_ASSETS[r.icon]) || 'assets/'+r.icon}" alt="Objet de ${clean(r.title)}" />`:''}<section class="role-manual"><h2>Comment jouer ce rôle</h2><p class="role-intro">Lis les étapes dans l'ordre. Les chiffres importants (portée, durée, charges) sont mis en évidence.</p><ol class="role-steps">${steps}</ol></section><div class="role-reminder"><strong>Important</strong><span>Les valeurs qui dépendent du Host sont signalées dans les instructions. Les pouvoirs restent soumis à la phase de jeu et à leurs limites.</span></div>`;
 return pageLayout(r.title,`Guide de jeu : actions, limites et victoire du rôle ${r.title}.`,inner,'Rôles',meta);
}

 const filt=`<div class="filter-row">${cats.map(c=>`<button class="filter ${roleFilter===c?'active':''}" data-filter="${clean(c)}">${clean(c)}</button>`).join('')}<input id="roles-filter" class="filter-input" type="search" value="${clean(roleQuery)}" placeholder="Filtrer les rôles..." aria-label="Filtrer les rôles" /></div>`;
 const list=filtered.length?`<div class="role-grid">${filtered.map(r=>`<a class="role-link" href="#/role/${r.id}">${badge(r.camp,r.camp)}<span class="next-icon">↗</span><div class="role-title">${clean(r.title)}</div><p>${clean((r.lines[0]||'Entrée du catalogue des rôles').slice(0,105))}</p></a>`).join('')}</div>`:'<p>Aucun rôle ne correspond à cette recherche.</p>';

}
function eventPage(e){return pageLayout(e.title,`Événement d’ambiance du ${e.phase.toLowerCase()} inscrit dans le calendrier du mod.`,`${heading('Fiche événement','fiche')}${badge(e.phase)}${badge(e.retired?'Entrée historique':'Catalogué dans le code')}<p>Nom technique : <code>${clean(e.id.toUpperCase())}</code></p><p>Identifiant utilisé par les commandes de test : <code>${clean(e.command)}</code></p>${e.retired?notice('Événement retiré','Cette entrée historique est conservée pour stabiliser les identifiants réseau et n’est plus proposée comme événement actif.',true):notice('Scène d’ambiance','Ce phénomène est défini dans PhaseEventSchedule.java. Ses effets peuvent dépendre de la configuration et de l’environnement (shader, extérieur, météo).')}${heading('Autres phénomènes','autres')}${link('evenements','Voir tous les événements →')}`,'Événements')}

 return pageLayout('Événements','Le calendrier du mod combine des phénomènes météorologiques et des scènes surnaturelles. Certains peuvent être plus rares que d’autres.',`${notice('À savoir','Les événements d’ambiance ne modifient pas directement la victoire, les missions ou les règles de vote selon PhaseEventSchedule.java.')}${groups.map(g=>`${heading(g.title,normalize(g.title).replace(' ','-'))}<div class="role-grid">${g.entries.map(e=>`<a class="role-link" href="#/event/${e.id}">${badge(e.phase)}<div class="role-title">${clean(e.title)}</div><p>Identifiant : ${clean(e.command)}</p><span class="next-icon">↗</span></a>`).join('')}</div>`).join('')}${heading('Entrées historiques','historiques')}<p>Trois anciennes entrées restent dans l’énumération pour préserver les identifiants réseau, mais sont marquées comme retirées dans le code.</p>`,'Événements');
}

function missionPage(m){return pageLayout(m.title,`Mission enregistrée dans le catalogue du mod à ${m.place}.`,`${heading('Informations','informations')}<div class="table-wrap"><table><tbody><tr><td>Lieu</td><td>${clean(m.place)}</td></tr><tr><td>Type d’interaction</td><td>${clean(m.kind)}</td></tr><tr><td>Identifiant</td><td><code>${clean(m.id)}</code></td></tr></tbody></table></div>${notice('Point d’ancrage nécessaire','L’existence d’une mission dans le catalogue ne prouve pas que tous ses points sont placés sur une carte précise. L’hôte doit vérifier l’installation des points avant la partie.',true)}${missionHelp[m.id]?`${heading('Comment jouer','conseils-mission')}<p>${clean(missionHelp[m.id])}</p>`:''}${heading('Retour au catalogue','catalogue')}${link('missions','Toutes les missions →')}`,'Missions')}
function missionsPage(){
 const grouped={};data.missions.forEach(m=>(grouped[m.place]??=[]).push(m));
 return pageLayout('Missions','Les tâches du village peuvent aussi être réalisées par les fantômes. Les points, étapes et destinations sont définis sur la carte.',`${notice('Catalogue et carte','Le catalogue affiché ici est une sélection documentaire ; la liste active dépend de la version du mod, de la carte et des points enregistrés. Les cinq missions interactives restantes ont leurs tests dédiés.',true)}${heading('Comment ça marche ?','fonctionnement')}<p>Selon la mission, le joueur doit cliquer sur un point, maintenir une interaction pendant un temps donné, transporter un objet ou suivre plusieurs étapes. Certaines missions peuvent comporter un incident.</p><p><strong>Après la mort :</strong> les fantômes peuvent continuer leurs missions personnelles, y compris la nuit. Ces réussites augmentent la progression du Village mais ne donnent ni objet ni sabotage. Leurs mini-jeux de fantômes restent disponibles.</p><p><strong>Tester les cinq mini-jeux :</strong> démarre <code>/werewolf solotest</code>, puis <code>/werewolf mission test peche</code>, <code>rituel</code>, <code>armures</code>, <code>dalles</code>, <code>verification</code>. <code>/werewolf mission test relancer</code> recommence le même essai. Les essais ne donnent pas de progression de victoire ; les points doivent être configurés sur la carte.</p>${heading('Missions par lieu','lieux')}${Object.entries(grouped).map(([place,list])=>`<details><summary>${clean(place)} <span class="minor">· ${list.length} missions</span></summary><div class="details-body">${list.map(m=>`<div style="padding:5px 0">${link('mission/'+m.id,m.title)} <span class="minor"> · ${m.kind==='CLICK'?'Interaction':m.kind==='HOLD'?'Maintien':m.kind==='DELIVERY'?'Livraison':m.kind}</span></div>`).join('')}</div></details>`).join('')}${heading('Conseils pour l’hôte','hote')}<p>Vérifie l’emplacement des ancrages et les accès avant de démarrer. Une mission enregistrée dans le code n’est pas automatiquement prête sur toutes les cartes.</p>`,'Missions');

function destinyPage(d){return pageLayout(d.title,`Destin Secret de catégorie « ${d.category} ».`,`${heading('Présentation','presentation')}<div class="meta-row">${badge(d.category)}${badge('Rare · tirage journalier')}</div><p>Ce Destin apparaît comme un objectif secondaire attribué secrètement à un joueur éligible. Les étapes et récompenses propres au Destin s’affichent au joueur concerné dans l’interface du mod.</p>${notice('Tirage et compatibilité','À partir du deuxième jour et avec au moins quatre joueurs vivants, le mod effectue au maximum un essai journalier à 25 %. Les rôles incompatibles sont exclus ; un même joueur ne reçoit pas de second Destin.')}${heading('Règle générale','regle')}<p>Un Destin Secret ne change pas directement les conditions de victoire. En cas de changement de rôle, il est conservé s’il reste compatible, sinon il se termine sans nouvelle attribution au joueur.</p>${heading('Autres Destins','autres')}${link('destins','Voir le répertoire des Destins →')}`,'Destins Secrets')}
function destinyPageList(){return pageLayout('Destins Secrets','Des événements personnels très rares, distincts du rôle principal et cachés aux autres joueurs.',`${notice('Probabilités du code','25 % de chance pour un seul tirage journalier à partir de J2, sous conditions. Après un tirage réussi, un joueur éligible puis un Destin compatible disponible sont choisis uniformément.')}${heading('Les huit Destins','huit') }<div class="role-grid">${data.destinies.map(d=>`<a class="role-link" href="#/destin/${d.id}">${badge(d.category)}<span class="next-icon">↗</span><div class="role-title">${clean(d.title)}</div><p>Objectif secondaire secret</p></a>`).join('')}</div>${heading('Limite de Destins actifs','limites')}<div class="table-wrap"><table><thead><tr><th>Participants initiaux</th><th>Maximum simultané</th></tr></thead><tbody><tr><td>Jusqu’à 7</td><td>1</td></tr><tr><td>8 à 12</td><td>2</td></tr><tr><td>13 à 20</td><td>3</td></tr><tr><td>21 à 25</td><td>4</td></tr><tr><td>26 à 50</td><td>5</td></tr></tbody></table></div>${heading('Vie du Destin','vie')}<p>Un Destin est individuel et reste secret. Les types déjà attribués ne sont pas remis dans le tirage ; la partie et les conditions de victoire continuent normalement.</p>`,'Destins Secrets')}

function standardPage(id){
 let body='';
 switch(id){
 case 'presentation': body=`${heading('Qu’est-ce que Werewolf: Dark Nights ?','quest-ce')}<p>Un mod de Loup-Garou pour Minecraft Forge 1.20.1 dans un village médiéval. Chaque joueur reçoit un rôle secret. Le village accomplit ses missions et cherche à identifier les loups ; la meute se cache parmi les habitants et chasse à la nuit tombée.</p>${heading('Un monde vivant','monde')}<p>La carte peut comprendre un village, un château, un port et une grotte des loups. La météo, les événements de nuit, la brume et la communication vocale transforment chaque partie en histoire différente.</p>${heading('Les grandes particularités','particularites')}<ul><li>Rôles et pouvoirs spécifiques, avec interface privée.</li><li>Réunions et votes autour du feu.</li><li>Missions personnelles, collectives et sabotages.</li><li>Communication vocale avec Simple Voice Chat.</li><li>Événements spéciaux et Destins Secrets.</li></ul>${notice('État du mod','Documentation issue des sources v0.70 : la compilation Forge et une partie multijoueur complète ne sont pas certifiées par cette documentation.',true)}`;break;
 case 'commencer':body=`${heading('Prérequis','prerequis')}<ul><li>Minecraft <strong>Java Edition 1.20.1</strong>.</li><li>Forge compatible avec la version du projet et <strong>Java 17</strong>.</li><li><strong>Simple Voice Chat avec API voicechat_api 2.6.0 ou supérieure</strong>, dépendance obligatoire déclarée dans mods.toml.</li><li>La même version du mod sur le client et le serveur.</li></ul>${heading('Installer le mod','installer')}<p>Quand un fichier JAR jouable aura été compilé et validé, place-le dans le dossier <code>mods</code> de Minecraft et du serveur avec ses dépendances. Lance ensuite Forge et vérifie que les mods sont bien reconnus.</p>${notice('Attention : archive source','La v0.70 dont proviennent ces pages est une archive de sources, pas un fichier JAR prêt à installer. Ne la glisse pas telle quelle dans mods.',true)}${heading('Premiers pas','premiers-pas')}<p>Utilise <code>/werewolf tutoriel commencer</code> pour accéder au tutoriel prévu dans le code, puis rejoins un salon avec <code>/werewolf join</code>. L’hôte peut ouvrir son interface via <code>/werewolf host</code>.</p>`;break;
 case 'deroulement':body=`${heading('1. Le salon','salon')}<p>Les joueurs rejoignent le salon, l’hôte prépare la composition, puis chacun indique qu’il est prêt.</p>${heading('2. Le jour','jour')}<p>Le village explore les lieux, progresse dans ses missions et échange ses observations. Certains loups peuvent participer aux missions ou les saboter.</p>${heading('3. La nuit','nuit')}<p>Les loups peuvent se transformer et chasser. Les rôles possédant un pouvoir nocturne peuvent l’utiliser selon leurs limites.</p>${heading('4. Réunion et vote','reunion')}<p>Les joueurs se réunissent pour discuter, élire le Maire selon la phase, ou choisir une personne à éliminer. Les voix ne se calculent pas forcément toutes de la même façon.</p>${heading('5. Fin de partie','fin')}<p>La partie se termine lorsque les conditions de victoire programmées sont remplies. Certains indépendants peuvent avoir une victoire personnelle sans interrompre la manche.</p>`;break;
 case 'camps':body=`${heading('Le Village','village')}<p>Les villageois gagnent en découvrant la meute ou en complétant la progression du village selon les règles prévues. Les rôles de protection et d’information les aident à survivre.</p>${heading('La Meute','meute')}<p>Les loups partagent un objectif collectif, des aptitudes nocturnes et un canal de communication secret. Le Traître peut gagner avec eux sans posséder leur transformation.</p>${heading('Les indépendants','independants')}<p>Le Rat malade, le Chasseur de primes, le Pacifiste, l’Alchimiste fou ou d’autres rôles ont des objectifs personnels. Certaines victoires ne mettent pas fin à la partie.</p>${heading('Les liens et camps évolutifs','liens')}<p>Cupidon, les Jumeaux, l’Enfant Sauvage et l’Usurpateur ont des mécaniques de liaison ou de changement de camp. Leur appartenance réelle dépend de leur rôle et de son évolution.</p>${notice('Loup Blanc','Ce loup possède des capacités de meute, mais son objectif propre est de finir dernier survivant.')}`;break;
 case 'votes':body=`${heading('L’élection','election')}<p>Lors de la première réunion, un Roi ou une Reine peut être élu. Le titre est public et ajoute du poids à son bulletin, sans remplacer son rôle secret.</p>${heading('L’élimination','elimination')}<p>Les participants discutent puis désignent un suspect. Le vote <code>PASSER</code> permet de choisir une réunion sans exécution lorsqu’il est proposé.</p>${heading('Voix spéciales','voix-speciales')}<p>Le Maire dispose de deux voix. Le Corbeau peut ajouter une voix à une cible marquée une nuit sur deux. Les bonus du Corbeau ne se cumulent pas avec un vote du Maire sur la même cible : le total reste de deux voix, pas trois.</p>${heading('La discrétion','discretion')}<p>Les informations obtenues via les rôles sont privées, à moins qu’un pouvoir ne prévoit explicitement une annonce publique.</p>`;break;
 case 'morts':body=`${heading('Après l’élimination','apres')}<p>Le joueur rejoint l’état de spectateur ou de défunt selon les règles de la partie. Le TAB ne montre plus les morts. Le menu des fantômes comprend un registre des rôles présents, avec leur état vivant/mort, sans révéler à qui appartient chaque rôle.</p>${heading('Parler avec les morts','parler')}<p>Les fantômes peuvent continuer les missions du Village et conserver leurs pouvoirs spectraux. Le menu des activités est allégé : quatre parcours chronométrés et un Jump dans une dimension privée, avec chrono libre et retour au dernier checkpoint en cas de chute. Les fantômes y voient leurs compagnons sans collision et les vivants restent dans le monde principal. Les mini-jeux spectraux et le classement de points ont été retirés. Le Médium dispose d’une capacité temporaire d’écoute des défunts. Le chat vocal sépare les vivants des morts selon les règles applicables aux pouvoirs.</p>${heading('Interdiction des informations hors-jeu','hors-jeu')}<p>Pour préserver le secret, évite de transmettre aux vivants des informations obtenues après ta mort par des canaux extérieurs.</p>`;break;
 case 'voix':body=`${heading('Simple Voice Chat','svc')}<p>Le mod demande l’API Simple Voice Chat 2.6.0 ou supérieure. Les voix de proximité permettent les discussions, les poursuites et l’écoute des rôles spéciaux.</p>${heading('Chuchotements','chuchotements')}<p>Pour chuchoter dans Simple Voice Chat, maintiens <strong>Shift</strong> en parlant : aucune commande <code>/w</code> n'est nécessaire. Pendant une manche, les messages privés Minecraft <code>/w</code>, <code>/msg</code> et <code>/tell</code> sont bloqués pour les participants. L’hôte règle la distance avec <code>/werewolf voix chuchotement</code>.</p>${heading('Annonce de l’aube','aube')}<p>Pendant la nuit, les joueurs vivants reçoivent un message à 30 s de la fin, une annonce visuelle et sonore à 10 s, puis un compte à rebours discret de 5 à 1 s avant la téléportation automatique vers le feu.</p>${heading('Piège du Trappeur','trappeur')}<p>Le Trappeur pose ses pièges de jour. Un loup transformé qui déclenche un piège pendant la nuit reste <strong>immobilisé pendant 5 secondes</strong>, sans dégâts. Le piège est consommé.</p>${heading('Musique de partie','musique')}<p>Les pistes originales de Werewolf (jour, nuit et vote) ne dépendent plus du curseur <strong>Musique</strong> de Minecraft. Le <strong>volume principal</strong> du jeu reste respecté : à 0 %, tous les sons, y compris cette bande-son, sont coupés. Les scènes de silence spéciales et la fin de manche arrêtent toujours les pistes.</p>${heading('Canaux spécifiques','canaux')}<ul><li><strong>Loups :</strong> canal secret de meute via <code>/lg &lt;message&gt;</code>.</li><li><strong>Jumeaux :</strong> messages privés via <code>/werewolf jumeau &lt;message&gt;</code>, et voix privée selon proximité.</li><li><strong>Médium :</strong> écoute temporaire des morts.</li><li><strong>Petite Fille :</strong> écoute nocturne limitée et lecture du chat de meute pendant son pouvoir ; les expéditeurs s’affichent « Loup inconnu ».</li><li><strong>Hurleur :</strong> perturbe temporairement le vocal des joueurs proches.</li></ul>`;break;
 case 'commandes':body=`${heading('Joueurs','joueurs')}<div class="cmd-list">${[
 ['/werewolf tutoriel commencer','Démarre le tutoriel.'],['/werewolf host','Ouvre l’interface hôte si tu en as le droit.'],['/werewolf join','Rejoint un salon.'],['/werewolf salon','Ouvre le salon des joueurs prêts.'],['/werewolf pret','Indique que tu es prêt (ou annule).'],['/werewolf leave','Quitte un salon.'],['/werewolf role','Rappelle ton rôle.'],['/werewolf status','Affiche l’état de la partie.'],['/lg <message>','Canal écrit de la meute.'],['/werewolf jumeau <message>','Canal privé entre Jumeaux.'],['/werewolf voix chuchotement etat','Affiche l’état du chuchotement vocal Shift.']].map(c=>command(...c)).join('')}</div>${heading('Hôte et administration','administration')}<div class="cmd-list">${[
 ['/werewolf reprise sauvegarder','Sauvegarde immédiatement un checkpoint (droits admin).'],['/werewolf reprise continuer','Reprend une partie sauvegardée (droits admin).'],['/werewolf carte verifier','Vérifie la configuration de carte.'],['/werewolf anticamp pos1','Marque le premier coin à hauteur des pieds.'],['/werewolf anticamp pos2','Marque le second coin.'],['/werewolf anticamp ajouter toit maison01','Interdit un toit (3 s avant replacement).'],['/werewolf anticamp ajouter charpente charpente01','Protège un toit à mission avec autorisation temporaire pour la charpente.'],['/werewolf anticamp ajouter autorise tour01','Crée une exception pour une tour/rempart accessible.'],['/werewolf anticamp liste','Affiche toutes les zones sauvegardées dans cette dimension.'],['/werewolf anticamp verifier','Vérifie la zone où tu te tiens.'],['/werewolf anticamp supprimer maison01','Supprime une zone nommée.'],['/werewolf anticamp arbres activer','Active la protection des cimes d’arbres.'],['/werewolf anticamp arbres desactiver','Désactive la protection des cimes d’arbres.'],['/werewolf collectif points','Consulte les points de mission collective.'],['/werewolf testevent','Outils de test des événements, selon droits et arguments.'],['/werewolf solotest','Démarre une manche test avec un seul véritable joueur.'],['/werewolf mission test peche|rituel|armures|dalles|verification','Sélectionne le mini-jeu à tester sur ta carte.'],['/werewolf mission test relancer','Recommence le même mini-jeu sans récompense de victoire.'],].map(c=>command(...c,true)).join('')}</div>${notice('Commandes sensibles','Certaines sous-commandes exigent les permissions d’administrateur ou le statut d’hôte. Consulte l’autocomplétion en jeu pour connaître les arguments disponibles.',true)}`;break;
 case 'host':body=`${heading('Préparer la partie','preparer')}<ol><li>Installer Forge 1.20.1, Simple Voice Chat et le JAR validé.</li><li>Vérifier les zones de village, château, port et grotte concernées.</li><li>Contrôler les ancrages de missions et les points nécessaires.</li><li>Définir la composition en fonction du nombre réel de participants.</li><li>Faire rejoindre les joueurs et vérifier qu’ils sont prêts.</li></ol>${heading('Commandes utiles','commandes-utiles')}<div class="cmd-list">${command('/werewolf host','Interface de configuration pour l’hôte.')}${command('/werewolf carte verifier','Contrôles de la carte.',true)}${command('/werewolf anticamp','Configurer les toits interdits, les missions de charpente, les exceptions et les arbres.',true)}${command('/werewolf collectif points','Points des missions collectives.',true)}${command('/werewolf reprise sauvegarder','Forcer un checkpoint.',true)}</div>${heading('Configuration conseillée','conseil')}<p>Pour les premières vraies parties, privilégie une composition Équilibrée sur un groupe de taille réaliste et conserve les paramètres par défaut, puis ajuste après les retours des joueurs.</p>`;break;
 case 'sauvegarde':body=`${heading('Points de sauvegarde','points')}<p>Les sources contiennent une logique de checkpoint avec les participants, leurs états, leurs rôles et une partie des mécaniques de manche.</p>${heading('Reprise après arrêt','reprise')}<p>La reprise après redémarrage peut revenir à la discussion plutôt qu’au milieu d’un scrutin : les bulletins ne sont pas conservés tels quels. Certaines missions collectives peuvent être réinitialisées, et une validation administrative est prévue.</p>${heading('Commandes de reprise','commandes-reprise')}<div class="cmd-list">${command('/werewolf reprise sauvegarder','Demande un point de sauvegarde.',true)}${command('/werewolf reprise continuer','Relance la partie sauvegardée.',true)}${command('/werewolf reprise abandon','Abandonne la reprise en attente.',true)}</div>${notice('Tests encore nécessaires','La présence du système de sauvegarde dans les sources ne garantit pas à elle seule une reprise parfaite après un vrai crash serveur. Il faut le tester avec une partie réelle.',true)}`;break;
 case 'equilibrage':body=`${heading('Le mode Équilibrée','mode')}<p>La distribution des rôles possède des garde-fous pour éviter certaines combinaisons déséquilibrées. Elle ajuste notamment le nombre de loups à la taille du groupe.</p><div class="table-wrap"><table><thead><tr><th>Joueurs</th><th>Loups du mode Équilibrée</th></tr></thead><tbody>${[[6,1],[10,2],[12,3],[15,3],[20,4],[25,5]].map(([n,w])=>`<tr><td>${n}</td><td>${w}</td></tr>`).join('')}</tbody></table></div>${heading('Groupes réalistes','groupes')}<p>Commence avec 8 à 15 joueurs pour régler les premiers équilibres, puis teste à 20–25 lorsque le groupe est disponible. Le support technique visé peut monter plus haut sans que cela garantisse le même équilibre.</p>${heading('Ce que les tests ne prouvent pas','limites')}<p>Des tirages valides ne prouvent pas que les chances de victoire sont équilibrées. Cela se mesure avec des manches jouées, la durée de survie des loups, l’efficacité des missions et les résultats des votes.</p>`;break;
 case 'versions':body=`${heading('v0.96 — Interaction des missions nocturnes en cave','wdn-096')}<p>Correction des missions nocturnes dans les maisons, notamment lorsque le marqueur vise une chaise ou un meuble occupant plusieurs cases. Un clic sur la partie voisine du mobilier est accepté dans un rayon très limité, et les sièges moddés représentés par des entités peuvent déclencher l’interaction. La progression reste vérifiée sur le serveur (phase, proximité, mission active et maintien éventuel). Les missions de jour restent inchangées. Cette correction est présente dans les sources v0.96 et doit être confirmée sur la carte en jeu.</p>${heading('v0.95 — Copie intégrale du village pour le Jump','wdn-095')}<p>L’hôte peut maintenant dupliquer sa vraie map dans la dimension privée du Jump sans WorldEdit. Hors partie, exécuter <code>/werewolf jump copier</code>, puis redémarrer complètement le serveur : le mod recopie le terrain, l’eau, les constructions, les blocs de mods, les coffres, les entités et les points d’intérêt avant de charger la dimension Jump. Ensuite, utiliser <code>/werewolf jump atelier</code> depuis le village pour arriver aux mêmes coordonnées dans sa copie. Le monde principal reste intact, et l’ancienne dimension Jump est sauvegardée avant remplacement. Une nouvelle copie écrasera les constructions modifiées dans le Jump : les sauvegarder avant de réimporter. Sources v0.95 disponibles ; validation Forge en jeu nécessaire.</p>${heading('v0.94 — Jump privé et colorants de contrôle','wdn-094')}<p>Le Jump dispose de sa propre dimension : les fantômes s’y retrouvent, se voient sans collision et ne sont pas visibles depuis le village des vivants. Le chrono indique le temps écoulé sans imposer de limite. Trois colorants contrôlent désormais le Jump ET les quatre parcours : vert pour le dernier checkpoint, jaune pour recommencer en remettant le chrono à zéro, rouge pour quitter. L’hôte entre dans l’atelier avec <code>/werewolf jump atelier</code>, construit le Jump, place le départ, les checkpoints et l’arrivée, puis revient avec <code>/werewolf jump retour</code>. Il peut importer une copie de son village via WorldEdit ; le mod ne la duplique pas automatiquement. Les quatre parcours classiques conservent leur limite de 150 secondes. Fonctionnement à confirmer en multijoueur.</p>${heading('v0.93 — Jump des fantômes et menu simplifié','wdn-093')}<p>Les fantômes disposent d’un Jump distinct des quatre parcours existants, sans chrono ni classement. L’hôte place le départ, de 1 à 12 checkpoints et l’arrivée avec la commande <code>/werewolf jump</code>. Une chute renvoie le fantôme au dernier checkpoint validé ; le retour manuel est aussi possible dans le menu R. Les mini-jeux spectraux inutilisés (devinettes, duels et chasse aux âmes), ainsi que le classement, ont été retirés. Les missions du Village et leurs mini-jeux restent accessibles aux fantômes. Modifications présentes dans les sources v0.93, à valider dans Minecraft.</p>${heading('v0.92 — Musique réglable séparément','wdn-092')}<p>Les musiques propres à Werewolf: Dark Nights sont désormais reliées au curseur Musique de Minecraft, tout en respectant le volume général. Chaque joueur peut ajuster ou couper les thèmes du jour, de la nuit et des votes sans modifier les bruitages ni les voix. Le mod ne force plus le volume Musique à 6 % au début ni à 0 % à la fin d’une partie. Les fondus et l’arrêt de la musique vanilla pendant une manche sont conservés. Fonctionnement à confirmer en jeu.</p>${heading('v0.91 — Jauge d’endurance intégrée','wdn-091')}<p>L’endurance remplace visuellement la faim dans l’interface : une jauge compacte de 81 × 10 pixels, sans texte, occupe l’emplacement des anciennes icônes de nourriture. La recharge d’attaque des loups est descendue tout en restant dans un panneau indépendant. Les positions par défaut des deux éléments sont ajustées automatiquement une fois, sans déplacer les autres panneaux de l’éditeur HUD.</p>${heading('v0.90 — Propulsion des loups et anti-camping','wdn-090')}<p>Le Bondisseur se propulse vers l’avant avec un grand saut instantané : chaque bond consomme 15 % d’endurance si cette option est active, avec 45 secondes de recharge. Le dash habituel des loups est légèrement accéléré (environ 9 %), avec son coût de 30 % et son délai de recharge inchangés. Tous les loups transformés peuvent accéder aux toits, aux charpentes et aux cimes des arbres ; l’interdiction revient sous forme humaine. Les bordures de carte restent actives.</p>${heading('v0.89 — Fenêtre du Colporteur','wdn-089')}<p>La fenêtre d’échange du Colporteur sépare les statuts des deux joueurs, clarifie le résultat et espace les boutons. Les règles de l’échange restent identiques.</p>${heading('v0.90 — Endurance, fin de la faim et échanges','wdn-088')}<p>L’endurance remplace la faim en partie : la nourriture reste pleine et la jauge de faim vanilla est masquée. Le mod ne génère plus de coffres de ravitaillement et ne remplit plus de coffres existants avec du pain ou des pommes. Les coffres de missions et de décor restent inchangés. Les échanges du Colporteur présentent la confirmation dans une fenêtre privée, sans répétition inutile dans le chat. Ces changements sont documentés dans les sources v0.90 et doivent encore être testés en partie.</p>${heading('v0.80 — Résurrection et inventaire','wdn-080')}<p>Lorsqu’un joueur est ressuscité par la Sorcière, il retrouve sa barre rapide et son inventaire de manche exactement comme avant sa mort : grimoire, carnet des suspects, objets de rôle et leurs données. Cela fonctionne aussi pour l’auto-résurrection de la Sorcière, sans restaurer les charges déjà consommées ni réinitialiser les délais de ses pouvoirs. En cas de sauvegarde plus ancienne, les outils manquants sont réattribués. Le retour à l’inventaire personnel de Minecraft en fin de partie reste séparé.</p>${heading('v0.79 — Fiches de rôle et élection','wdn-079')}<p>Chaque rôle possède un objectif de victoire clairement indiqué, avec des consignes et portées colorées. Dans le jeu, la fiche initiale est réunie sur un seul écran, avec défilement sur les petites résolutions. L’élection du maire dure désormais 35 secondes, ou 45 secondes dès 25 joueurs, et peut être désactivée dans le menu Host : Votes > Confidentialité. Les sauvegardes et profils conservent ce choix. Les dépouilles sont repositionnées au sol. Les fantômes peuvent voler hors parcours, mais pas pendant les quatre parcours. La bordure autorise uniquement les trajets des parcours actifs, sans permettre de quitter la carte librement.</p>${heading('v0.78 — Fin de nuit annoncée','wdn-078')}<p>Un rappel est affiché à 30 secondes de l’aube. À 10 secondes, les joueurs vivants voient « L’AUBE APPROCHE » avec un carillon. Les 5 dernières secondes s’affichent discrètement au-dessus de la barre rapide, avec de petits bips sur les 3 dernières. Le rassemblement au feu et la durée de nuit restent inchangés.</p>${heading('v0.77 — Musique de partie','wdn-077')}<p>La bande-son des phases reste audible si un joueur modifie le curseur Musique de Minecraft pendant une partie. Les volumes de la bande-son restent à 1 % le jour et 6 % la nuit / aux votes ; le volume principal Minecraft est toujours respecté.</p>${heading('Documentation v0.3','doc-0-1')}<p>Documentation consultable en local, avec les 44 fiches de rôles synchronisées avec la v0.70. Thème médiéval, repères colorés, émojis et fiches de rôle, événements, missions et Destins Secrets extraits des sources du mod.</p>${heading('Source : mod v0.70','mod-59-22')}<p>Cette version documente notamment la lecture anonyme du chat des loups par la Petite Fille, les quêtes des fantômes et les cinq tests de mini-jeux. Les descriptions des rôles viennent du fichier RoleGuide.java actuel.</p>${heading('À valider','a-valider')}<ul><li>Compilation et démarrage du JAR Forge.</li><li>Essais complets avec plusieurs joueurs.</li><li>Vérification finale des réglages, descriptions et commandes en jeu.</li></ul>${notice('Site indépendant','Ce site ne reprend ni le code, ni les textes, ni les visuels d’UHC World. Il s’inspire uniquement de l’organisation classique d’une documentation : navigation latérale, fiches thématiques et moteur de recherche.')}`;break;
 }
 return pageLayout(docs[id].title,docs[id].description,body,docs[id].group);
}
function routeId(){let route=decodeURIComponent((location.hash||'#/accueil').slice(2));return route||'accueil'}
function render(){
 current=routeId();
 let html;
 if(current==='accueil')html=home();
 else if(current==='roles')html=rolesPage();
 else if(current.startsWith('role/')){const r=byId[current.slice(5)];html=r?rolePage(r):null;if(r)collapsed[r.camp]=false;}
 else if(current==='evenements')html=eventsPage();
 else if(current.startsWith('event/')){const e=byEvent[current.slice(6)];html=e?eventPage(e):null;}
 else if(current==='missions')html=missionsPage();
 else if(current.startsWith('mission/')){const m=byMission[current.slice(8)];html=m?missionPage(m):null;}
 else if(current==='destins')html=destinyPageList();
 else if(current.startsWith('destin/')){const d=byDestiny[current.slice(7)];html=d?destinyPage(d):null;}
 else if(docs[current])html=standardPage(current);
 if(!html){html=pageLayout('Page introuvable','Cette page n’existe pas dans le grimoire.',link('accueil','Retour à l’accueil →'),'Erreur');current='notfound'}
 content.innerHTML=html;
 decorateImportantText(content);
 document.title=(current==='accueil'?'Accueil':content.querySelector('h1')?.textContent||'Documentation')+' | Werewolf: Dark Nights';
 sidebarHtml();
 buildToc();
 if(current==='roles')bindRoleFilters();
 closeSidebar();
 window.scrollTo({top:0,behavior:'instant'});
}
function buildToc(){
 const heads=[...content.querySelectorAll('h2[id],h3[id]')];
 toc.innerHTML=heads.length?`<h3>SUR CETTE PAGE</h3>${heads.map(h=>`<a href="#${clean(h.id)}" data-anchor="${clean(h.id)}">${clean(h.textContent)}</a>`).join('')}<div class="toc-note">« La vérité se cache dans les ombres. »</div>`:'';
 toc.querySelectorAll('[data-anchor]').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();document.getElementById(a.dataset.anchor)?.scrollIntoView({behavior:'smooth'});}));
}
function bindRoleFilters(){
 document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{roleFilter=b.dataset.filter;const focused=document.activeElement?.id==='roles-filter';renderRoleContent();if(focused)document.querySelector('#roles-filter')?.focus()}));
 document.querySelector('#roles-filter')?.addEventListener('input',e=>{roleQuery=e.target.value;renderRoleContent(true)});
}
function renderRoleContent(preserveFocus=false){
 const target=document.querySelector('#role-results');if(!target)return;
 const filtered=data.roles.filter(r=>(roleFilter==='Tous'||r.camp===roleFilter)&&normalize(r.title+' '+r.camp).includes(normalize(roleQuery)));
 target.innerHTML=filtered.length?`<div class="role-grid">${filtered.map(r=>`<a class="role-link" href="#/role/${r.id}">${badge(r.camp,r.camp)}<span class="next-icon">↗</span><div class="role-title">${clean(r.title)}</div><p>${clean((r.lines[0]||'Entrée du catalogue des rôles').slice(0,105))}</p></a>`).join('')}</div>`:'<p>Aucun rôle ne correspond à cette recherche.</p>';
 decorateImportantText(target);
 document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el.dataset.filter===roleFilter));
}
function closeSidebar(){sidebar.classList.remove('open');overlay.hidden=true;document.querySelector('#menu-toggle').setAttribute('aria-expanded','false')}
function openSidebar(){sidebar.classList.add('open');overlay.hidden=false;document.querySelector('#menu-toggle').setAttribute('aria-expanded','true')}
function searchIndex(){
 const arr=Object.entries(docs).map(([id,d])=>({id,title:d.title,group:d.group,body:d.description}));
 data.roles.forEach(r=>arr.push({id:'role/'+r.id,title:r.title,group:'Rôle · '+r.camp,body:r.lines.join(' ')}));
 data.events.filter(e=>!e.retired).forEach(e=>arr.push({id:'event/'+e.id,title:e.title,group:'Événement · '+e.phase,body:e.command}));
 data.destinies.forEach(d=>arr.push({id:'destin/'+d.id,title:d.title,group:'Destin Secret',body:d.category}));
 data.missions.forEach(m=>arr.push({id:'mission/'+m.id,title:m.title,group:'Mission · '+m.place,body:m.id+' '+m.kind}));
 return arr;
}
const searchPages=searchIndex();
function search(q){const words=normalize(q).split(/\s+/).filter(Boolean);let items=searchPages.map(it=>{
 const title=normalize(it.title),group=normalize(it.group),body=normalize(it.body);
 let score=0;
 for(const word of words){if(title===word)score+=12;else if(title.startsWith(word))score+=9;else if(title.includes(word))score+=6;else if(group.includes(word))score+=3;else if(body.includes(word))score+=1;else return null}
 return {item:it,score};
 }).filter(Boolean).sort((a,b)=>b.score-a.score||a.item.title.localeCompare(b.item.title,'fr'));
 return (words.length?items:searchPages.filter(it=>['roles','missions','evenements','destins','commandes'].includes(it.id)).map(item=>({item}))).slice(0,35).map(x=>x.item);
}
function drawSearch(){lastResults=search(searchInput.value);selectedSearch=0;
 searchResults.innerHTML=lastResults.length?lastResults.map((it,i)=>`<button class="search-result ${i===0?'selected':''}" data-pos="${i}"><span class="result-title">${clean(it.title)}</span><span class="result-meta">${clean(it.group)}</span></button>`).join(''):'<div class="search-empty">Aucun résultat dans le grimoire.</div>';
 searchResults.querySelectorAll('[data-pos]').forEach(b=>b.addEventListener('click',()=>navigateSearch(Number(b.dataset.pos))));
}
function highlightSearch(){searchResults.querySelectorAll('[data-pos]').forEach(el=>el.classList.toggle('selected',Number(el.dataset.pos)===selectedSearch));searchResults.querySelector('.selected')?.scrollIntoView({block:'nearest'});}
function navigateSearch(i){if(lastResults[i]){location.hash='#/'+lastResults[i].id;closeSearch()}}
function openSearch(){closeSidebar();modal.hidden=false;searchInput.value='';drawSearch();setTimeout(()=>searchInput.focus(),20)}
function closeSearch(){modal.hidden=true}
window.addEventListener('hashchange',()=>{closeSearch();render()});
document.querySelector('#menu-toggle').addEventListener('click',()=>sidebar.classList.contains('open')?closeSidebar():openSidebar());
overlay.addEventListener('click',closeSidebar);
document.querySelector('#search-launch').addEventListener('click',openSearch);
document.querySelector('#search-close').addEventListener('click',closeSearch);
modal.addEventListener('click',e=>{if(e.target===modal)closeSearch()});
searchInput.addEventListener('input',drawSearch);
searchInput.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();selectedSearch=Math.min(lastResults.length-1,selectedSearch+1);highlightSearch()}if(e.key==='ArrowUp'){e.preventDefault();selectedSearch=Math.max(0,selectedSearch-1);highlightSearch()}if(e.key==='Enter'){e.preventDefault();navigateSearch(selectedSearch)}});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'||e.key==='/'&&document.activeElement?.tagName!=='INPUT'){e.preventDefault();openSearch()}
 else if(e.key==='Escape'){closeSearch();closeSidebar()}
});
if(!location.hash)location.hash='#/accueil';else render();
})();

</script>
</body>
</html>
